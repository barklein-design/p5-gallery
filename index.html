<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5 Sketches</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    body { font: 14px/1.4 system-ui, -apple-system, sans-serif; color: #222; }
    iframe { display: block; border: 0; width: 100%; height: calc(100% - 36px); }
    .nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid #ddd; background: #fff; color: #333;
      font-size: 20px; cursor: pointer; display: grid; place-items: center;
    }
    .nav:hover { background: #f4f4f4; }
    .nav:disabled { opacity: .25; cursor: default; background: #fff; }
    #prev { left: 16px; }
    #next { right: 16px; }
    #title {
      height: 36px; line-height: 36px; text-align: center;
      font-size: 12px; color: #999;
    }
  </style>
</head>
<body>
  <div id="title"></div>
  <iframe id="frame" title="sketch"></iframe>
  <button class="nav" id="prev" aria-label="Previous">&#8592;</button>
  <button class="nav" id="next" aria-label="Next">&#8594;</button>

  <script>
    // Add new sketches here: { name, file }
    const SKETCHES = [
      { name: 'Self-avoiding path', file: 'sketches/self-avoiding-path.js' },
      { name: 'Oscillating brush', file: 'sketches/oscillating-brush.js' },
      { name: 'Spinning brush', file: 'sketches/spinning-brush.js' },
      { name: 'Synthesizer', file: 'sketches/synthesizer.js' },
      { name: 'Synthesizer 2', file: 'sketches/synthesizer-2.js' },
    ];

    const frame = document.getElementById('frame');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const title = document.getElementById('title');

    let i = Math.min(Math.max(parseInt(location.hash.slice(1)) || 0, 0), SKETCHES.length - 1);

    function show(n) {
      i = Math.min(Math.max(n, 0), SKETCHES.length - 1);
      const s = SKETCHES[i];
      // Fresh iframe per sketch so p5 globals never leak between sketches
      frame.src = 'runner.html?' + Date.now() + '#' + encodeURIComponent(s.file);
      title.textContent = s.name + '  ·  ' + (i + 1) + ' / ' + SKETCHES.length;
      document.title = s.name;
      history.replaceState(null, '', '#' + i);
      prev.disabled = i === 0;
      next.disabled = i === SKETCHES.length - 1;
    }

    prev.onclick = () => show(i - 1);
    next.onclick = () => show(i + 1);
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'ArrowRight') show(i + 1);
    });

    show(i);
  </script>
</body>
</html>
