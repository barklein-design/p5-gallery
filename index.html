<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5 Sketches</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    body { font: 14px/1.4 system-ui, -apple-system, sans-serif; color: #222; }
    iframe { display: block; border: 0; width: 100%; height: calc(100% - 36px); }
    .nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid #ddd; background: #fff; color: #333;
      font-size: 20px; cursor: pointer; display: grid; place-items: center;
    }
    .nav:hover { background: #f4f4f4; }
    .nav:disabled { opacity: .25; cursor: default; background: #fff; }
    #prev { left: 16px; }
    #next { right: 16px; }
    #title {
      height: 36px; line-height: 36px; text-align: center;
      font-size: 12px; color: #999;
    }
  </style>
</head>
<body>
  <div id="title"></div>
  <iframe id="frame" title="sketch"></iframe>
  <button class="nav" id="prev" aria-label="Previous">&#8592;</button>
  <button class="nav" id="next" aria-label="Next">&#8594;</button>

  <script>
    // Every sketches/<folder>/sketch.js is a sketch; nothing to register here.
    // Live site: sketches.json comes from the deploy workflow.
    // Locally: read the folder listing from python's http.server.
    async function loadSketches() {
      const res = await fetch('sketches.json', { cache: 'no-store' });
      if (res.ok) return res.json();
      const html = await (await fetch('sketches/', { cache: 'no-store' })).text();
      const links = new DOMParser().parseFromString(html, 'text/html').querySelectorAll('a');
      return [...links]
        .map(a => a.getAttribute('href'))
        .filter(href => /^[^/.?][^/]*\/$/.test(href))
        .map(href => decodeURIComponent(href.slice(0, -1)))
        .sort();
    }

    // 'self-avoiding-path' -> 'Self avoiding path'
    function displayName(folder) {
      const words = folder.replace(/[-_]+/g, ' ');
      return words.charAt(0).toUpperCase() + words.slice(1);
    }

    const frame = document.getElementById('frame');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const title = document.getElementById('title');

    let SKETCHES = [];
    let i = 0;

    function show(n) {
      i = Math.min(Math.max(n, 0), SKETCHES.length - 1);
      const folder = SKETCHES[i];
      const name = displayName(folder);
      // Fresh iframe per sketch so p5 globals never leak between sketches
      frame.src = 'runner.html?' + Date.now() + '#' + encodeURIComponent(folder);
      title.textContent = name + '  ·  ' + (i + 1) + ' / ' + SKETCHES.length;
      document.title = name;
      history.replaceState(null, '', '#' + encodeURIComponent(folder));
      prev.disabled = i === 0;
      next.disabled = i === SKETCHES.length - 1;
    }

    prev.onclick = () => show(i - 1);
    next.onclick = () => show(i + 1);
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'ArrowRight') show(i + 1);
    });

    loadSketches().then(list => {
      SKETCHES = list;
      show(Math.max(SKETCHES.indexOf(decodeURIComponent(location.hash.slice(1))), 0));
    });
  </script>
</body>
</html>
