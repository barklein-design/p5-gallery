<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: #fff; }
    body {
      text-align: center;
      padding: 8px 72px 16px; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: #333;
    }
    /* Sketches that build their own layout wrapper: center it, keep its text left-aligned */
    body > div { width: fit-content; margin: 0 auto; text-align: left; }
    canvas { display: block; margin: 0 auto 12px; box-shadow: 0 0 0 1px #e5e5e5; }
    p { margin: 6px 0; }
    button { font: inherit; padding: 4px 12px; cursor: pointer; }
    input[type=range] { vertical-align: middle; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
  <script>
    // Load the sketch named in the URL hash, e.g. runner.html#sketches/foo.js
    const s = document.createElement('script');
    s.src = decodeURIComponent(location.hash.slice(1));
    document.body.appendChild(s);
  </script>
</body>
</html>
