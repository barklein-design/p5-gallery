name: Deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # List every sketches/<folder>/sketch.js so students never edit a shared file
      - name: Generate sketches.json
        run: |
          find sketches -mindepth 2 -maxdepth 2 -name sketch.js \
            | cut -d/ -f2 | sort | jq -R . | jq -s . > sketches.json
          cat sketches.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
